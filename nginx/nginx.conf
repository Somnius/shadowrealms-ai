events {
    worker_connections 1024;
}

http {
    # Real client address (docs/SECURITY_MODEL.md "Proxy trust"). Public traffic arrives from the
    # DietPi reverse proxy (10.0.0.10), which appends the client to X-Forwarded-For. Only that
    # address is trusted to name the client; with real_ip_recursive the rightmost untrusted entry
    # wins, so a client can't spoof its address by sending its own X-Forwarded-For. LAN clients
    # connect directly and keep their own address. Every proxied request then gets
    # X-Forwarded-For = that one address (overwritten, not appended), and the backend trusts
    # exactly one hop (TRUSTED_PROXY_HOPS=1, ProxyFix).
    set_real_ip_from 10.0.0.10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # https when the DietPi proxy says so (it terminates TLS), else this hop's own scheme.
    map $realip_remote_addr $sr_forwarded_proto {
        10.0.0.10 $http_x_forwarded_proto;
        default   $scheme;
    }

    upstream backend {
        server 127.0.0.1:5000;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name localhost 10.0.0.3;
        # Same headers the public edge adds, for people using the app directly on the LAN
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        proxy_hide_header X-Powered-By;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $sr_forwarded_proto;
        }

        # Live updates (Server-Sent Events, backend/routes/events.py): no buffering, long reads.
        location ~ ^/api/campaigns/[0-9]+/events$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $sr_forwarded_proto;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            # Don't log the short-lived ?ticket= query string
            access_log off;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $sr_forwarded_proto;
            # Storyteller replies can take a while (45s per model attempt, 55s total budget)
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
    }
}
