<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/sigil.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f1e" />
    <meta
      name="description"
      content="ShadowRealms AI - AI-Powered Tabletop RPG Platform"
    />
    <link rel="manifest" href="/manifest.json" />
    <!-- Critical paint: match app dark shell before bundled CSS/fonts finish -->
    <style>
      html { background-color: #0f0f1e; color-scheme: dark; }
      body {
        margin: 0;
        background-color: #0f0f1e;
        color: #e5e5e5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
    </style>
    <!-- Webfonts (all SIL OFL 1.1; see src/design/tokens.css). Cinzel has no Greek, so the design
         system swaps to Alegreya under :lang(el). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Alegreya:wght@500;700&amp;family=EB+Garamond:ital,wght@0,400..600;1,400..600&amp;family=Inter:wght@400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    />
    <title>ShadowRealms AI</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
