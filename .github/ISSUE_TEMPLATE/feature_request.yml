name: Feature request
description: An idea for something new or a change to how something works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/Somnius/shadowrealms-ai/blob/main/docs/ROADMAP_v0.9.md) and the open issues first, it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need
      description: What you're trying to do, and why the current behaviour gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who is it for
      multiple: true
      options:
        - Players
        - Storytellers
        - Admins / self-hosters
        - Developers
  - type: textarea
    id: rules
    attributes:
      label: Rules references
      description: If it's about game rules, which edition (Classic Revised or V5) and the book and page if you have them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
