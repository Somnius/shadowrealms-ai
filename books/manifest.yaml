# Rule books to import into ChromaDB (books/import_books.py). Data contract: docs/rules/RULE_BOOKS_RAG.md.
# path is relative to books/World_of_Darkness. Fields are explained in books/README.md.
# year = the copyright year printed in the PDF; 0 = not printed in this PDF.
# precedence (lower wins): V5 corebook 10, Players Guide 20, Companion 30, supplements 40, lore 50,
# adventures 60; Classic cores 10, guides and handbooks 30, clan/tradition/convention/tribe books 40.
